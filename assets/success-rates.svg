<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Mission success by agent design</title><desc id="desc">Qwen: baseline 28%, planning 8%, reflection 12%. Gemini: baseline 84%, planning 60%, reflection 88%. 25 episodes per configuration.</desc><rect width="1000" height="360" rx="14" fill="#0c1422"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="37" font-size="14" fill="#4de1c1">LEIDEN UNIVERSITY · GROUP 2</text><text x="32" y="74" font-size="26" font-weight="700" fill="#e5edf9">Does a more elaborate agent perform better?</text><text x="32" y="118" font-size="17" font-weight="700" fill="#e5edf9">qwen2.5:1.5b</text><text x="32" y="159" font-size="14" fill="#a0b0c7">Baseline</text><rect x="127" y="146" width="245" height="13" rx="6" fill="#23334a"/><rect x="127" y="146" width="68.6" height="13" rx="6" fill="#65b4ff"/><text x="388" y="159" font-size="14" fill="#e5edf9">28% (7/25)</text><text x="32" y="210" font-size="14" fill="#a0b0c7">Planning</text><rect x="127" y="197" width="245" height="13" rx="6" fill="#23334a"/><rect x="127" y="197" width="19.6" height="13" rx="6" fill="#b596ff"/><text x="388" y="210" font-size="14" fill="#e5edf9">8% (2/25)</text><text x="32" y="261" font-size="14" fill="#a0b0c7">Reflection</text><rect x="127" y="248" width="245" height="13" rx="6" fill="#23334a"/><rect x="127" y="248" width="29.4" height="13" rx="6" fill="#4de1c1"/><text x="388" y="261" font-size="14" fill="#e5edf9">12% (3/25)</text><text x="522" y="118" font-size="17" font-weight="700" fill="#e5edf9">gemini-3.5-flash-lite</text><text x="522" y="159" font-size="14" fill="#a0b0c7">Baseline</text><rect x="617" y="146" width="245" height="13" rx="6" fill="#23334a"/><rect x="617" y="146" width="205.8" height="13" rx="6" fill="#65b4ff"/><text x="878" y="159" font-size="14" fill="#e5edf9">84% (21/25)</text><text x="522" y="210" font-size="14" fill="#a0b0c7">Planning</text><rect x="617" y="197" width="245" height="13" rx="6" fill="#23334a"/><rect x="617" y="197" width="147.0" height="13" rx="6" fill="#b596ff"/><text x="878" y="210" font-size="14" fill="#e5edf9">60% (15/25)</text><text x="522" y="261" font-size="14" fill="#a0b0c7">Reflection</text><rect x="617" y="248" width="245" height="13" rx="6" fill="#23334a"/><rect x="617" y="248" width="215.6" height="13" rx="6" fill="#4de1c1"/><text x="878" y="261" font-size="14" fill="#e5edf9">88% (22/25)</text><text x="32" y="317" font-size="13" fill="#a0b0c7">Five BabyAI tasks × five seeds. Gemini’s reflection gain over baseline is one episode.</text><text x="32" y="339" font-size="12" fill="#a0b0c7">Exploratory comparison; reflection uses additional model calls. Source: Ass2-3/comparison.csv.</text></g></svg>